<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Proposal</title>
    <link rel="icon" href="image/gif1.gif" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background-color: #e9afe1;
            background-image: url("src/assets/bg.png");
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover;
            display: flex;
            height: 100vh;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            justify-content: center;
            align-items: center;
        }

        img {
            pointer-events: none;
        }

        canvas#confeti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1000;
        }

        .card {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 82vh;
            width: 90vw;
            max-width: 380px;
            position: relative;
            perspective: 1200px;
            transition: 1s;
        }

        .outside,
        .inside {
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .inside {
            background: linear-gradient(135deg, #ffffff, #ffeaf2);
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
        }

        .outside {
            transform-style: preserve-3d;
            z-index: 2;
            transform-origin: left;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            background-color: #dcc5c5;
            background-image: url("src/assets/front-bg.png");
            background-size: cover;
        }

        .card.open .outside {
            transform: rotateY(-180deg);
        }

        .front,
        .back {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            width: 100%;
            position: absolute;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            padding: 20px;
        }

        .back {
            transform: rotateY(180deg);
            background: linear-gradient(to left, #e7e7e7, #ffffff 30%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back-sticker img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .hiee {
            font-size: 26px;
            text-align: center;
            color: #781a0c;
            font-weight: 600;
            margin-bottom: 8px;
            font-family: 'Caveat', cursive;
        }

        /* Story Box styling with hidden scrollbar */
        .story-box {
            width: 100%;
            height: 65%;
            overflow-y: auto;
            text-align: left;
            line-height: 1.5;
            color: #4a154b;
            font-family: 'Caveat', cursive;
            font-size: 19px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);

            /* Hide scrollbar for Firefox & Edge */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Hide scrollbar for Chrome, Safari & Opera */
        .story-box::-webkit-scrollbar {
            display: none;
        }

        .main-sticker {
            height: 35%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-sticker img {
            max-height: 100%;
            object-fit: contain;
        }

        .proposal-text {
            font-size: 18px;
            font-weight: 600;
            color: #7b180d;
            margin: 5px 0;
            font-family: 'Caveat', cursive;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 12px;
            align-items: center;
            position: relative;
            min-height: 110px;
            justify-content: center;
        }

        .btn {
            background-color: #ff6b81;
            color: white;
            padding: 10px 0;
            width: 80%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(255, 107, 129, 0.4);
            transition: all 0.2s ease;
        }

        #noButton {
            background-color: #ff4757;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            position: relative;
            transition: all 0.15s ease-out;
        }

        .toast {
            position: fixed;
            top: 20px;
            background: rgba(120, 26, 12, 0.95);
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            z-index: 2000;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
            text-align: center;
            max-width: 85%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tap-hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
        }

        .cool-link {
            text-decoration: none;
            font-weight: 700;
            background: linear-gradient(45deg, #ff4b1f, #ff9068);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.3s ease;
            display: inline-block;
        }

        @media (max-width: 480px) {
            .card {
                width: 88vw;
                height: 78vh;
            }
            .story-box {
                font-size: 17px;
            }
            .proposal-text {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>
    <audio id="bgMusic" src="audio/song.mp3" loop preload="auto"></audio>

    <canvas id="confeti" width="300" height="300"></canvas>
    <div id="toast" class="toast"></div>

    <div class="card" id="mainCard">
        <div class="outside" onclick="openCard()">
            <div class="front">
                <div class="hiee">Hiee Rashi !!</div>
                <div class="story-box" id="storyText"></div>
                <div class="tap-hint">Tap card to see inside ❤️</div>
            </div>
            <div class="back">
                <div class="back-sticker">
                    <img src="src/assets/back.webp" alt="Phool !!">
                </div>
            </div>
        </div>

        <div class="inside">
            <div class="proposal-text">
                Toh chalo... aab baatein rehende dete hain!<br>
                Thursday ko I would like to ask you for a dinner date with me? 🌹
            </div>
            <div class="main-sticker">
                <img class="gif" src="src/assets/main-stk.webp" alt="Wanna Date?">
            </div>
            <div class="buttons">
                <button class="btn yes-btn" id="yesButton" onclick="nextPage('yes')">Yes!</button>
                <button class="btn no-btn" id="noButton" 
                        onmouseover="playWithNoButton(event)" 
                        ontouchstart="playWithNoButton(event)" 
                        onclick="handleNoClick(event)">No ⚠️</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p style="font-size: 14px; color: #444; font-weight: 500;">
            Made with ❤️ by 
            <a href="https://wa.me/919612152820" target="_blank" rel="noopener noreferrer" class="cool-link">
                Akash
            </a>
        </p>
    </footer>

    <script>
        const storyLines = [
            "Mujhe aaj bhi yaad hai jab hum pehli baar mile the... ❤️",
            "Itni traffic ke baad bhi tum aayi, phir hum rameshwaram gaye tumhare PG ke paas... 🙈",
            "Phir toh bas kahani shuru si ho gayi hamari!",
            "I know tumhe kaafi shikayate hain mujhse, maine ek-ek cheez apne dimaag mein rakhi hai...",
            "Jaise tumhe late night maggie ya dosto ke saath ghumna aur rehna pasand hai... 🍜✨",
            "Aur tumhe dosto ke saath movie dekhna pasand hai, aur mujhe usme tumhe dekhna! 🎬😍",
            "Na jaane kab... meri goodnight tumse hone lagi hai 🌙",
            "Subah utho... oh sorry, tumhari subah toh dopahar 2 baje hoti na! Hahaha! 😂 (Sorry for this 😜)",
            "Aur haan... tumhe pearls ka shauq hai, lekin sabse anmol toh tum ho... tumhe khud nahi pata! ✨💖"
        ];

        let lineIdx = 0;
        let charIdx = 0;
        const storyBox = document.getElementById("storyText");

        function typeWriter() {
            if (lineIdx < storyLines.length) {
                if (charIdx < storyLines[lineIdx].length) {
                    storyBox.innerHTML += storyLines[lineIdx].charAt(charIdx);
                    charIdx++;
                    storyBox.scrollTop = storyBox.scrollHeight;
                    setTimeout(typeWriter, 35);
                } else {
                    storyBox.innerHTML += "<br><br>";
                    lineIdx++;
                    charIdx = 0;
                    setTimeout(typeWriter, 350);
                }
            }
        }

        // Always start audio from 0:00 (the beginning) on page load/refresh
        function startAudio() {
            const music = document.getElementById("bgMusic");
            if (music && music.paused) {
                music.currentTime = 0; // Reset track to start
                music.play().then(() => {
                    console.log("Audio started from beginning!");
                }).catch(err => {
                    console.log("Audio waiting for user tap:", err);
                });
            }
        }

        window.onload = function() {
            // Reset audio time explicitly when window loads
            const music = document.getElementById("bgMusic");
            if (music) {
                music.currentTime = 0;
            }
            typeWriter();
            setTimeout(resizeWindow, 0);
        };

        function openCard() {
            document.getElementById("mainCard").classList.toggle("open");
            startAudio();
        }

        // Global backup trigger on screen interaction
        document.addEventListener("click", startAudio, { once: true });
        document.addEventListener("touchstart", startAudio, { once: true });

        function nextPage(choice) {
            if (choice === 'yes') {
                window.location.href = "src/yes.html";
            }
        }

        let playCount = 0;
        const warningMessages = [
            "⚠️ Hey Dekho! No wala galat button hai! Danger sign! 🛑",
            "Aree Galti se touch ho gaya na No? Wo dekho upar chaand! 🌙✨",
            "No dabane ki koshish bhi mat karo, button bhaag jayega! 😜",
            "Arey re... galti se click ho raha hai shayad! I know your heart says YES! ❤️"
        ];

        function playWithNoButton(e) {
            if (e && e.cancelable) e.preventDefault();
            const noBtn = document.getElementById("noButton");
            
            const x = Math.random() * 160 - 80;
            const y = Math.random() * 120 - 60;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
            
            showToast(warningMessages[playCount % warningMessages.length]);
            playCount++;
        }

        function handleNoClick(e) {
            if (e) e.stopPropagation();
            
            showToast("Chalo tumhare insaan ke paas le chalta hu... 💖");
            
            setTimeout(() => {
                const noMsg = encodeURIComponent("Arre yaarr galti se 'No' click ho gaya... net ka issue tha! Par mera answer to YES hi hai! ❤️🙈");
                window.location.href = `https://wa.me/919612152820?text=${noMsg}`;
            }, 1800);
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.style.display = "block";
            setTimeout(() => {
                toast.style.display = "none";
            }, 2500);
        }

        // Confetti script
        var COLORS, Confetti, NUM_CONFETTI, canvas, confetti, context, drawCircle, drawCircle2, drawCircle3, range, xpos;
        NUM_CONFETTI = 40;
        COLORS = [[235, 90, 70], [97, 189, 79], [242, 214, 0], [0, 121, 191], [195, 119, 224]];
        canvas = document.getElementById("confeti");
        context = canvas.getContext("2d");
        
        window.resizeWindow = function () {
            window.w = canvas.width = window.innerWidth;
            return window.h = canvas.height = window.innerHeight;
        };
        window.addEventListener("resize", resizeWindow, false);

        range = function (a, b) { return (b - a) * Math.random() + a; };

        drawCircle = function (a, b, c, d) {
            context.beginPath();
            context.moveTo(a, b);
            context.bezierCurveTo(a - 17, b + 14, a + 13, b + 5, a - 5, b + 22);
            context.lineWidth = 2;
            context.strokeStyle = d;
            return context.stroke();
        };

        drawCircle2 = function (a, b, c, d) {
            context.beginPath();
            context.moveTo(a, b);
            context.lineTo(a + 6, b + 9);
            context.lineTo(a + 12, b);
            context.lineTo(a + 6, b - 9);
            context.closePath();
            context.fillStyle = d;
            return context.fill();
        };

        drawCircle3 = function (a, b, c, d) {
            context.beginPath();
            context.moveTo(a, b);
            context.lineTo(a + 5, b + 5);
            context.lineTo(a + 10, b);
            context.lineTo(a + 5, b - 5);
            context.closePath();
            context.fillStyle = d;
            return context.fill();
        };

        xpos = 0.9;
        document.onmousemove = function (a) { return xpos = a.pageX / w; };

        Confetti = (function () {
            function a() {
                this.style = COLORS[~~range(0, 5)];
                this.rgb = "rgba(" + this.style[0] + "," + this.style[1] + "," + this.style[2];
                this.r = ~~range(2, 6);
                this.r2 = 2 * this.r;
                this.replace();
            }
            a.prototype.replace = function () {
                this.opacity = 0;
                this.dop = 0.03 * range(1, 4);
                this.x = range(-this.r2, w - this.r2);
                this.y = range(-20, h - this.r2);
                this.xmax = w - this.r;
                this.ymax = h - this.r;
                this.vx = range(0, 2) + 8 * xpos - 5;
                return this.vy = 0.7 * this.r + range(-1, 1);
            };
            a.prototype.draw = function () {
                this.x += this.vx;
                this.y += this.vy;
                this.opacity += this.dop;
                if (1 < this.opacity) { this.opacity = 1; this.dop *= -1; }
                if (0 > this.opacity || this.y > this.ymax) this.replace();
                if (!(0 < this.x && this.x < this.xmax)) this.x = (this.x + this.xmax) % this.xmax;
                drawCircle(~~this.x, ~~this.y, this.r, this.rgb + "," + this.opacity + ")");
                drawCircle3(0.5 * ~~this.x, ~~this.y, this.r, this.rgb + "," + this.opacity + ")");
                return drawCircle2(1.5 * ~~this.x, 1.5 * ~~this.y, this.r, this.rgb + "," + this.opacity + ")");
            };
            return a;
        })();

        confetti = (function () {
            var a, c = [];
            for (a = 1; a <= NUM_CONFETTI; a++) c.push(new Confetti());
            return c;
        })();

        window.step = function () {
            requestAnimationFrame(step);
            context.clearRect(0, 0, w, h);
            for (var b = 0; b < confetti.length; b++) confetti[b].draw();
        };
        step();
    </script>
    <script src="script.js"></script>
</body>

</html>
